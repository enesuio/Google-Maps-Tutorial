name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hydrox
          POSTGRES_PASSWORD: hydrox
          POSTGRES_DB: hydrox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hydrox -d hydrox_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://hydrox:hydrox@localhost:5432/hydrox_test
      DATABASE_URL: postgres://hydrox:hydrox@localhost:5432/hydrox_test
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_ORIGIN: http://localhost:3000
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
